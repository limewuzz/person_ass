name: Unified local RC
on:
  pull_request:
    branches: [v0.1_personal]
  push:
    branches: [v0.1_personal, 'integration/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unified-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-rc:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.lock
      - run: npm ci --prefix frontend --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: node scripts/mw.mjs test
      - run: node scripts/mw.mjs package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-local-rc-${{ github.sha }}
          path: |
            frontend/evidence/release/
            frontend/evidence/*junit.xml
            frontend/evidence/live-integration/junit.xml
            frontend/evidence/screenshots/home-1600.png
            frontend/evidence/screenshots/tasks-390.png
            frontend/evidence/live-integration/screenshots/real-task-success.png
            release/
          retention-days: 14
  dependency-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/security_check.py
      - run: npm ci --prefix frontend --no-audit --no-fund
      - run: npm audit --audit-level=high --json > npm-audit.json
        working-directory: frontend
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r backend/requirements.lock --strict -f json -o python-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-${{ github.sha }}
          path: |
            frontend/npm-audit.json
            python-audit.json
          retention-days: 14
