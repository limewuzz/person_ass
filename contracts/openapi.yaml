components:
  securitySchemes:
    humanBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Human/agent auth; required object-level authorization.
    workerBearer:
      type: http
      scheme: bearer
      bearerFormat: Opaque
      description: Separate Worker issuer/audience and scopes; never use a human token.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code: &id008
              type: string
              minLength: 1
            message: *id008
        trace_id: *id007
      required:
      - error
      - trace_id
    PageMeta:
      type: object
      properties:
        next_cursor:
          type:
          - string
          - 'null'
    Origin:
      type: object
      properties:
        channel:
          enum:
          - web
          - android
          - cli
          - rakazo
          - system
          - other
        source_ref:
          type:
          - string
          - 'null'
      required:
      - channel
    Node:
      type: object
      properties:
        id: *id008
        name: *id008
        role:
          enum:
          - PRIMARY
          - STANDBY_GATEWAY
          - RELAY
          - EXISTING_BUSINESS
          - WORKER
        health:
          enum:
          - healthy
          - degraded
          - offline
          - unknown
        observed_at:
          anyOf:
          - &id009
            type: string
            format: date-time
          - type: 'null'
        last_seen_at:
          anyOf:
          - *id009
          - type: 'null'
        stale:
          type: boolean
        source: *id008
      required:
      - id
      - name
      - role
      - health
      - stale
      - source
    Resource:
      type: object
      properties:
        id: *id008
        kind:
          enum:
          - node
          - service
          - agent
          - model
          - project
          - integration
          - artifact
          - workflow
        node_id:
          type:
          - string
          - 'null'
        owner_system: *id008
        display_name: *id008
        health:
          enum:
          - healthy
          - degraded
          - offline
          - unknown
        observed_at:
          anyOf:
          - *id009
          - type: 'null'
        stale:
          type: boolean
        source: *id008
      required:
      - id
      - kind
      - owner_system
      - display_name
      - health
      - stale
      - source
    Capability:
      type: object
      properties:
        name: *id008
        version:
          type: integer
          minimum: 1
        risk:
          enum:
          - READ
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
        read_only:
          type: boolean
        enabled:
          type: boolean
        requires_approval:
          type: boolean
        args_schema:
          type: object
      required:
      - name
      - version
      - risk
      - enabled
      - read_only
    Agent:
      type: object
      properties:
        id: *id008
        display_name: *id008
        owner_system: *id008
        runtime_node_id:
          type:
          - string
          - 'null'
        status:
          enum:
          - available
          - degraded
          - offline
          - unknown
        capabilities:
          type: array
          items:
            type: string
        observed_at:
          anyOf:
          - *id009
          - type: 'null'
      required:
      - id
      - display_name
      - owner_system
      - status
      - capabilities
    WorkItem:
      type: object
      properties:
        id: *id007
        title: *id008
        kind:
          enum:
          - task
          - idea
          - paper
          - issue
          - project
        status:
          enum:
          - open
          - in_progress
          - blocked
          - done
          - archived
        source_system:
          type:
          - string
          - 'null'
        created_at: *id009
        created_by: *id007
      required:
      - id
      - title
      - kind
      - status
      - created_at
      - created_by
    WorkItemCreate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          enum:
          - task
          - idea
          - paper
          - issue
          - project
        source_system:
          type:
          - string
          - 'null'
        source_external_id:
          type:
          - string
          - 'null'
      required:
      - title
      - kind
    TaskCreate:
      type: object
      properties:
        work_item_id:
          anyOf:
