            format: uuid
          - type: 'null'
        capability:
          type: string
          minLength: 1
        resource_id:
          type: string
          minLength: 1
        arguments:
          type: object
          additionalProperties: true
        dry_run:
          type: boolean
          default: false
        origin:
          $ref: '#/components/schemas/Origin'
      required:
      - capability
      - resource_id
      - arguments
      - origin
    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
        work_item_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        resource_id:
          type: string
          minLength: 1
        capability:
          type: string
          minLength: 1
        state:
          enum:
          - DRAFT
          - VALIDATING
          - WAITING_APPROVAL
          - QUEUED
          - LEASED
          - RUNNING
          - SUCCEEDED
          - FAILED
          - CANCELED
          - EXPIRED
          - NEEDS_RECONCILIATION
        generation:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        trace_id:
          type: string
          format: uuid
        risk:
          type: string
          enum:
          - READ
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
        dry_run:
          type: boolean
        arguments_redacted:
          type: object
          additionalProperties: true
        origin:
          $ref: '#/components/schemas/Origin'
      required:
