          type: string
          format: uuid
        state:
          type: string
          minLength: 1
        trace_id:
          type: string
          format: uuid
        poll_url:
          type: string
          minLength: 1
        replayed:
          type: boolean
      required:
      - task_id
      - state
      - trace_id
      - poll_url
      - replayed
    TaskEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1
        kind:
          type: string
          minLength: 1
        occurred_at:
          type: string
          format: date-time
        summary:
          type: string
          minLength: 1
        trace_id:
          type: string
          format: uuid
      required:
      - id
      - task_id
      - sequence
      - kind
      - occurred_at
      - summary
      - trace_id
    Approval:
      type: object
      properties:
        id:
          type: string
          format: uuid
