components:
  securitySchemes:
    humanBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Human/agent auth; required object-level authorization.
    workerBearer:
      type: http
      scheme: bearer
      bearerFormat: Opaque
      description: Separate Worker issuer/audience and scopes; never use a human token.
  schemas:
    Error:
      type: object
      properties:
        error: &id001
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              minLength: 1
            message:
              type: string
              minLength: 1
            details_redacted:
              type: object
              description: Optional non-sensitive error context; no raw URL path/query
                or secrets.
        trace_id: &id002
          type: string
          format: uuid
      required:
      - error
      - trace_id
    PageMeta:
      type: object
      properties:
        next_cursor:
          type:
          - string
          - 'null'
    Origin:
      type: object
      properties:
        channel:
          enum:
          - web
          - android
          - cli
          - rakazo
          - system
          - other
        source_ref:
          type:
          - string
          - 'null'
      required:
      - channel
    Node:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        role:
          enum:
          - PRIMARY
          - STANDBY_GATEWAY
          - RELAY
          - EXISTING_BUSINESS
          - WORKER
        health:
          enum:
          - healthy
          - degraded
          - offline
          - unknown
        observed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        last_seen_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        stale:
          type: boolean
        source:
          type: string
          minLength: 1
      required:
      - id
      - name
      - role
      - health
      - stale
      - source
    Resource:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        kind:
          enum:
          - node
          - service
          - agent
          - model
          - project
          - integration
          - artifact
          - workflow
        node_id:
          type:
          - string
          - 'null'
        owner_system:
          type: string
          minLength: 1
        display_name:
          type: string
          minLength: 1
        health:
          enum:
          - healthy
          - degraded
          - offline
          - unknown
        observed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        stale:
          type: boolean
        source:
          type: string
          minLength: 1
        generation:
          type: integer
          minimum: 1
        lifecycle_state:
          type: string
          enum:
          - ACTIVE
          - DISABLED
          - DELETED
      required:
      - id
      - kind
      - owner_system
      - display_name
      - health
      - stale
      - source
    Capability:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        version:
          type: integer
          minimum: 1
        risk:
          enum:
          - READ
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
        read_only:
          type: boolean
        enabled:
          type: boolean
        requires_approval:
          type: boolean
        args_schema:
          type: object
      required:
      - name
      - version
      - risk
      - enabled
      - read_only
    Agent:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        display_name:
          type: string
          minLength: 1
        owner_system:
          type: string
          minLength: 1
        runtime_node_id:
          type:
          - string
          - 'null'
        status:
          enum:
          - available
          - degraded
          - offline
          - unknown
        capabilities:
          type: array
          items:
            type: string
        observed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
      required:
      - id
      - display_name
      - owner_system
      - status
      - capabilities
    WorkItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
        kind:
          enum:
          - task
          - idea
          - paper
          - issue
          - project
        status:
          enum:
          - open
          - in_progress
          - blocked
          - done
          - archived
        source_system:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
        instructions:
          type:
          - string
          - 'null'
        attachments:
          type: array
          items:
            type: string
      required:
      - id
      - title
      - kind
      - status
      - created_at
      - created_by
    WorkItemCreate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          enum:
          - task
          - idea
          - paper
          - issue
          - project
        source_system:
          type:
          - string
          - 'null'
        source_external_id:
          type:
          - string
          - 'null'
        instructions:
          type:
          - string
          - 'null'
          maxLength: 4000
        attachments:
          type: array
          items:
            type: string
      required:
      - title
      - kind
    TaskCreate:
      type: object
      properties:
        work_item_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        capability:
          type: string
          minLength: 1
        resource_id:
          type: string
          minLength: 1
        arguments:
          type: object
          additionalProperties: true
        dry_run:
          type: boolean
          default: false
        origin:
          $ref: '#/components/schemas/Origin'
      required:
      - capability
      - resource_id
      - arguments
      - origin
    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
        work_item_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        resource_id:
          type: string
          minLength: 1
        capability:
          type: string
          minLength: 1
        state:
          enum:
          - DRAFT
          - VALIDATING
          - WAITING_APPROVAL
          - QUEUED
          - LEASED
          - RUNNING
          - SUCCEEDED
          - FAILED
          - CANCELED
          - EXPIRED
          - NEEDS_RECONCILIATION
        generation:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        trace_id:
          type: string
          format: uuid
        risk:
          type: string
          enum:
          - READ
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
        dry_run:
          type: boolean
        arguments_redacted:
          type: object
          additionalProperties: true
        origin:
          $ref: '#/components/schemas/Origin'
      required:
      - id
      - resource_id
      - capability
      - state
      - generation
      - created_at
      - updated_at
      - trace_id
    TaskAccepted:
      type: object
      properties:
        task_id:
          type: string
          format: uuid
        state:
          type: string
          minLength: 1
        trace_id:
          type: string
          format: uuid
        poll_url:
          type: string
          minLength: 1
        replayed:
          type: boolean
      required:
      - task_id
      - state
      - trace_id
      - poll_url
      - replayed
    TaskEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1
        kind:
          type: string
          minLength: 1
        occurred_at:
          type: string
          format: date-time
        summary:
          type: string
          minLength: 1
        trace_id:
          type: string
          format: uuid
      required:
      - id
      - task_id
      - sequence
      - kind
      - occurred_at
      - summary
      - trace_id
    Approval:
      type: object
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        state:
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - EXPIRED
          - CONSUMED
        risk:
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        requester_ref:
          type: string
        scope:
          type: string
        action:
          type: string
        resource_id:
          type: string
        arguments_redacted:
          type: object
          additionalProperties: true
        target_generation:
          type:
          - integer
          - 'null'
          minimum: 1
      required:
      - id
      - task_id
      - state
      - risk
      - expires_at
      - created_at
    Artifact:
      type: object
      properties:
        id:
          type: string
          format: uuid
        task_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        storage_system:
          type: string
          minLength: 1
        uri:
          type: string
          minLength: 1
        sha256:
          type:
          - string
          - 'null'
          pattern: ^[0-9a-f]{64}$
        byte_size:
          type:
          - integer
          - 'null'
          minimum: 0
      required:
      - id
      - storage_system
      - uri
    Observation:
      type: object
      properties:
        resource_id:
          type: string
          minLength: 1
        status:
          enum:
          - healthy
          - degraded
          - offline
          - unknown
        observed_at:
          type: string
          format: date-time
        ttl_seconds:
          type: integer
          minimum: 1
        source:
          type: string
          minLength: 1
        stale:
          type: boolean
        details_redacted:
          type: object
      required:
      - resource_id
      - status
      - observed_at
      - ttl_seconds
      - source
      - stale
    Integration:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        display_name:
          type: string
          minLength: 1
        status:
          enum:
          - PLANNED
          - PROBED
          - CONNECTED
          - UNAVAILABLE
          - UNKNOWN
        last_verified_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        scope_labels:
          type: array
          items:
            type: string
      required:
      - id
      - display_name
      - status
      - scope_labels
    WorkerHeartbeat:
      type: object
      properties:
        node_id:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
        available_capabilities:
          type: array
          items:
            type: string
        observed_at:
          type: string
          format: date-time
      required:
      - node_id
      - version
      - available_capabilities
      - observed_at
    WorkerClaim:
      type: object
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 5
          default: 1
        capabilities:
          type: array
          items:
            type: string
      required:
      - limit
    WorkerTask:
      type: object
      properties:
        task_id:
          type: string
          format: uuid
        capability:
          type: string
          minLength: 1
        resource_id:
          type: string
          minLength: 1
        arguments:
          type: object
        generation:
          type: integer
          minimum: 1
        lease_token:
          type: string
          minLength: 1
        lease_until:
          type: string
          format: date-time
      required:
      - task_id
      - capability
      - resource_id
      - generation
      - lease_token
      - lease_until
    WorkerClaimResponse:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/WorkerTask'
      required:
      - tasks
    WorkerResult:
      type: object
      properties:
        generation:
          type: integer
          minimum: 1
        lease_token:
          type: string
          minLength: 1
        outcome:
          enum:
          - SUCCEEDED
          - FAILED
        result_summary:
          type: string
          maxLength: 4000
      required:
      - generation
      - lease_token
      - outcome
    WorkerStarted:
      type: object
      properties:
        generation:
          type: integer
          minimum: 1
        lease_token:
          type: string
          minLength: 1
      required:
      - generation
      - lease_token
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        actor_ref:
          type: string
          minLength: 1
        action:
          type: string
          minLength: 1
        resource_ref:
          type: string
          minLength: 1
        result:
          type: string
          minLength: 1
        created_at:
          type: string
          format: date-time
        trace_id:
          type: string
          format: uuid
      required:
      - id
      - actor_ref
      - action
      - resource_ref
      - result
      - created_at
      - trace_id
    Me:
      type: object
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          minLength: 1
        display_name:
          type: string
          minLength: 1
        allowed_scopes:
          type: array
          items:
            type: string
      required:
      - id
      - role
      - display_name
      - allowed_scopes
    Status:
      type: object
      properties:
        status:
          enum:
          - ok
          - degraded
        checked_at:
          type: string
          format: date-time
      required:
      - status
      - checked_at
    NodeList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Node'
        next_cursor:
          type:
          - string
          - 'null'
      required:
      - items
    ResourceList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
        next_cursor:
          type:
          - string
          - 'null'
      required:
      - items
    CapabilityList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
        next_cursor:
          type:
          - string
          - 'null'
      required:
      - items
    AgentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Agent'
        next_cursor:
          type:
          - string
          - 'null'
      required:
      - items
    WorkItemList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkItem'
        next_cursor:
          type:
          - string
          - 'null'
      required:
      - items
    TaskList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        next_cursor:
          type:
          - string
          - 'null'
      required:
      - items
    TaskEventList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaskEvent'
        next_cursor:
          type:
          - string
          - 'null'
      required:
      - items
    ApprovalList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Approval'
        next_cursor:
          type:
          - string
          - 'null'
      required:
      - items
    ArtifactList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Artifact'
        next_cursor:
          type:
          - string
          - 'null'
      required:
      - items
    ObservationList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Observation'
        next_cursor:
          type:
          - string
          - 'null'
      required:
      - items
    IntegrationList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Integration'
        next_cursor:
          type:
          - string
          - 'null'
      required:
      - items
    AuditEventList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        next_cursor:
          type:
          - string
          - 'null'
      required:
      - items
    DataSourceMeta:
      type: object
      description: Observed data provenance; frontend MUST NOT infer LIVE from HTTP
        200.
      properties:
        data_mode:
          type: string
          enum:
          - LIVE
          - MOCK
          - UNAVAILABLE
        freshness:
          type: string
          enum:
          - FRESH
          - STALE
          - UNKNOWN
        source_system:
          type: string
        observed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        received_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        ttl_seconds:
          type:
          - integer
          - 'null'
          minimum: 0
        reason_code:
          type:
          - string
          - 'null'
        as_of:
          type: string
          format: date-time
      required:
      - data_mode
      - freshness
      - source_system
      - observed_at
      - received_at
      - ttl_seconds
      - as_of
    FeatureState:
      type: object
      properties:
        status:
          type: string
          enum:
          - AVAILABLE
          - MOCK_ONLY
          - DISABLED
          - NOT_IMPLEMENTED
        reason:
          type:
          - string
          - 'null'
        min_phase:
          type: string
          enum:
          - P1
          - P2
          - P3
      required:
      - status
      - min_phase
    UIBootstrap:
      type: object
      properties:
        contract_version:
          type: string
          minLength: 1
        server_time:
          type: string
          format: date-time
        app_mode:
          enum:
          - LOCAL_MOCK
          - STAGING
          - PRODUCTION
        identity:
          $ref: '#/components/schemas/Me'
        features:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FeatureState'
        source_meta:
          $ref: '#/components/schemas/DataSourceMeta'
      required:
      - contract_version
      - server_time
      - app_mode
      - features
      - source_meta
    DashboardSummary:
      type: object
      properties:
        nodes:
          $ref: '#/components/schemas/NodeList'
        task_counts:
          type: object
          additionalProperties:
            type:
            - integer
            - 'null'
            minimum: 0
        approval_counts:
          type: object
          additionalProperties:
            type:
            - integer
            - 'null'
            minimum: 0
        recent_events:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        source_meta:
          $ref: '#/components/schemas/DataSourceMeta'
      required:
      - nodes
      - task_counts
      - approval_counts
      - recent_events
      - source_meta
    DisplayRecord:
      type: object
      description: Read-only metadata for a future integration; not evidence of connectivity.
      properties:
        id:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        summary:
          type: string
        source_system:
          type: string
        source_meta:
          $ref: '#/components/schemas/DataSourceMeta'
        route_ref:
          type:
          - string
          - 'null'
        enabled:
          type: boolean
      required:
      - id
      - title
      - source_meta
      - enabled
    DisplayRecordList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DisplayRecord'
        next_cursor:
          type:
          - string
          - 'null'
        source_meta:
          $ref: '#/components/schemas/DataSourceMeta'
      required:
      - items
      - next_cursor
      - source_meta
    AuditHistoryList:
      type: object
