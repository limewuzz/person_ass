          type: string
          format: uuid
        state:
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - EXPIRED
          - CONSUMED
        risk:
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        requester_ref:
          type: string
        scope:
          type: string
        action:
          type: string
        resource_id:
          type: string
        arguments_redacted:
          type: object
          additionalProperties: true
        target_generation:
          type:
          - integer
          - 'null'
          minimum: 1
      required:
      - id
      - task_id
      - state
      - risk
      - expires_at
      - created_at
    Artifact:
      type: object
      properties:
        id:
          type: string
          format: uuid
        task_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        storage_system:
          type: string
          minLength: 1
        uri:
          type: string
          minLength: 1
        sha256:
          type:
          - string
          - 'null'
