components:
  securitySchemes:
    humanBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Human/agent auth; required object-level authorization.
    workerBearer:
      type: http
      scheme: bearer
      bearerFormat: Opaque
      description: Separate Worker issuer/audience and scopes; never use a human token.
  schemas:
    Error:
      type: object
      properties:
        error: &id001
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              minLength: 1
            message:
              type: string
              minLength: 1
            details_redacted:
              type: object
              description: Optional non-sensitive error context; no raw URL path/query
                or secrets.
        trace_id: &id002
          type: string
          format: uuid
      required:
      - error
      - trace_id
    PageMeta:
      type: object
      properties:
        next_cursor:
          type:
          - string
          - 'null'
    Origin:
      type: object
      properties:
        channel:
          enum:
          - web
          - android
          - cli
          - rakazo
          - system
          - other
        source_ref:
          type:
          - string
          - 'null'
      required:
      - channel
    Node:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        role:
          enum:
          - PRIMARY
          - STANDBY_GATEWAY
          - RELAY
          - EXISTING_BUSINESS
          - WORKER
        health:
          enum:
          - healthy
          - degraded
          - offline
          - unknown
        observed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        last_seen_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        stale:
          type: boolean
        source:
          type: string
          minLength: 1
      required:
      - id
      - name
      - role
      - health
      - stale
      - source
    Resource:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        kind:
          enum:
          - node
          - service
          - agent
          - model
          - project
          - integration
          - artifact
          - workflow
        node_id:
          type:
          - string
          - 'null'
        owner_system:
          type: string
          minLength: 1
        display_name:
          type: string
          minLength: 1
        health:
          enum:
          - healthy
          - degraded
          - offline
          - unknown
        observed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        stale:
          type: boolean
        source:
          type: string
          minLength: 1
        generation:
          type: integer
          minimum: 1
        lifecycle_state:
          type: string
          enum:
          - ACTIVE
          - DISABLED
          - DELETED
      required:
      - id
      - kind
      - owner_system
      - display_name
      - health
      - stale
      - source
    Capability:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        version:
          type: integer
          minimum: 1
        risk:
          enum:
          - READ
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
        read_only:
          type: boolean
        enabled:
          type: boolean
        requires_approval:
          type: boolean
        args_schema:
          type: object
      required:
      - name
      - version
      - risk
      - enabled
      - read_only
    Agent:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        display_name:
          type: string
          minLength: 1
        owner_system:
          type: string
          minLength: 1
        runtime_node_id:
          type:
          - string
          - 'null'
        status:
          enum:
          - available
          - degraded
          - offline
          - unknown
        capabilities:
          type: array
          items:
            type: string
        observed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
      required:
      - id
      - display_name
      - owner_system
      - status
      - capabilities
    WorkItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
        kind:
          enum:
          - task
          - idea
          - paper
          - issue
          - project
        status:
          enum:
          - open
          - in_progress
          - blocked
          - done
          - archived
        source_system:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
      required:
      - id
      - title
      - kind
      - status
      - created_at
      - created_by
    WorkItemCreate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          enum:
          - task
          - idea
          - paper
          - issue
          - project
        source_system:
          type:
          - string
          - 'null'
        source_external_id:
          type:
          - string
          - 'null'
      required:
